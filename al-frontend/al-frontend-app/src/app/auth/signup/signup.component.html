<div class="signup-container">
  <h2>SIGN-UP</h2>
  <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="username">Username</label>
      <input id="username" type="text" formControlName="username" />
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" />
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input id="confirmPassword" type="password" formControlName="confirmPassword" />
    </div>

    <div class="form-group">
      <label for="number">Phone Number</label>
      <input id="number" type="text" formControlName="number" />
    </div>

    <div class="form-group">
      <label for="role">Role</label>
      <select id="role" formControlName="role">
        <option value="" disabled>Select Role</option>
        <option value="admin">Admin</option>
        <option value="employee">Employee</option>
      </select>
    </div>

    <div class="form-group">
      <label for="companyType">Company Type</label>
      <select id="companyType" formControlName="companyType">
        <option value="">Select Type</option>
        <option value="company">Company</option>
        <option value="supplier">Supplier</option>
      </select>
    </div>

    <button type="submit" [disabled]="signupForm.invalid">Create Account</button>
  </form>

  <p class="login-link">Already have an account? <a routerLink="/login">Log In</a></p>
</div>
